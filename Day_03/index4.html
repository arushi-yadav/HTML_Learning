<!DOCTYPE html>
<html>
<head>
    <title>Subscript and Superscript Example</title>
</head>
<body>
    <h2>Subscript Example</h2>
    <p>Water formula: H<sub>2</sub>O</p>

    <h2>Superscript Example</h2>
    <p>Square of x: x<sup>2</sup></p>

    <h2>Combined Example</h2>
    <p>Chemical equation: CO<sub>2</sub> + H<sub>2</sub> → CH<sub>4</sub></p>
    <p>Math expression: a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></p>
</body>
</html>
