<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my form</title>
       
</head>
<body>
    <center>
    <h2>user form</h2>
    <hr width="30">
    </center>
<form action="" method="post">

    <label for="username">username:</label>

<input type="text" id="username" name="username" placeholder="enter  your name"><br><br>

<label for="pwd">password:</label>
<input type="password" id="password" name="pwd"><br><br>
<input type="checkbox" name="subscribe"><br><br>

<label for="male">Male</label>
<input type="radio" name="gender" value="male"> Male<br><br>

<label for="female">female</label>
<input type="radio" name="gender" value="female"> Female<br><br>

<label for="resume">resume</label>
<input type="file" id="resume" name="resume"><br><br>
<input type="submit" value="Submit">
<br></br>
<textarea id="message" name="message" rows="5" cols="60">
dear sir/madam,
I am submitting my user form. 
please verify my details and contact me if required.
thank you.
</textarea>
<select name="country">
  <option value="india">India</option>
  <option value="usa">USA</option>
  <option value="uk">UK</option>
</select>

</body>
</html>
